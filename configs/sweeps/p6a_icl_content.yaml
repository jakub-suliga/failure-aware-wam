# P6a (ICL-Kern): WAS steht im Kontext? Versuch 1 scheitert, Versuch 2 auf demselben Seed mit der Erinnerung im
# KV-Cache, ohne Gewichts-Update. Text = Korrektur, vor dem Versuch, sequentiell. Kontrollen: retry_plain (kein
# Kontext, kein Text), icl_text_only (nur Text). Vergleich über die Gewichte: icl_vs_adapter (Adapter, unverändert).
name: p6a_icl_content
out: results/sweeps/p6a_icl_content
episodes: 30
per_job: 10
n_par: 2
time: "16:00:00"
tasks: [move_playingcard_away, place_mouse_pad, pick_diverse_bottles, stack_blocks_two]
configs: [table_h_m05, table_h_m10, demo_randomized]
methods: [retry_plain, icl_text_only, icl_fail_obs, icl_fail_pred, icl_fail_predobs, icl_fail_diff, icl_fail_window,
          icl_fail_corrected, icl_demo_same, icl_demo_nearest, icl_fail_demo, icl_demo_fail, icl_fails_3att,
          icl_vs_adapter]
